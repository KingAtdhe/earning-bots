name: Test and build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the test suite (generators, storage, every bot, publishing)
        run: npm test

  apk:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into Android
        run: |
          npm ci
          npm run sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../EarningBots-${{ github.run_number }}.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: EarningBots-apk
          path: EarningBots-${{ github.run_number }}.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Earning Bots 2.0 build ${{ github.run_number }}
          body: Download the .apk below on your Android phone and open it to install.
          files: EarningBots-${{ github.run_number }}.apk
          make_latest: true
